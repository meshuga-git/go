# Golden tests (plan tasks 0.3 and 0.4) for every toolchain the plan
# names, each run twice:
#   minimal - Python 3.10 with the oldest library releases requirements.txt
#             allows (or the closest newer ones a platform offers); the
#             results must match tests/golden/<toolchain>-min.json
#             byte for byte, or are recorded where no such file exists;
#   random  - a randomly chosen newer Python with randomly chosen newer
#             library releases; checked with golden.py --compat.
# Every job uploads its results as an artifact, and the publish job
# commits them to the ci-results branch, under the name of the tested
# branch, so they can be read with git alone.

name: golden

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: golden-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: choose the versions
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        shell: python
        env:
          SEED: ${{ github.run_id }}
        run: |
          import json, os, random
          rng = random.Random(int(os.environ["SEED"]))
          systems = {
              "linux-gcc": "ubuntu-24.04",
              "linux-clang": "ubuntu-24.04",
              "windows-msvc": "windows-2022",
              "windows-mingw": "windows-2022",
              "macos-clang": "macos-15",
          }
          newer = ["3.11", "3.12", "3.13", "3.14"]
          include = []
          for toolchain, runner in systems.items():
              include.append({"toolchain": toolchain, "os": runner,
                              "versions": "minimal", "python": "3.10"})
              include.append({"toolchain": toolchain, "os": runner,
                              "versions": "random",
                              "python": rng.choice(newer)})
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": include}) + "\n")

  golden:
    name: >-
      ${{ matrix.toolchain }} / ${{ matrix.versions }}
      (Python ${{ matrix.python }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # Both Windows toolchains need MinGW g++: today's clustering.py
      # builds run_clustering with GNU-style options only.
      - name: Install MinGW-w64 GCC through MSYS2
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Put MinGW g++ on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Add-Content $env:GITHUB_PATH
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Set up the MSVC developer environment
        if: matrix.toolchain == 'windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install the minimal library versions
        if: matrix.versions == 'minimal'
        run: |
          python -m pip install uv
          python -m uv pip install --system --resolution lowest-direct --only-binary :all: -r requirements.txt

      - name: Install randomly chosen newer library versions
        if: matrix.versions == 'random'
        run: |
          python -m pip install packaging
          python tests/random_env.py ${{ github.run_id }}${{ strategy.job-index }}

      - name: Run the golden scenarios
        run: >-
          python tests/golden.py --toolchain ${{ matrix.toolchain }}
          --allow-missing
          ${{ matrix.versions == 'random' && '--compat' || '' }}
          --out results/${{ matrix.toolchain }}-${{ matrix.versions }}.json

      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-${{ matrix.toolchain }}-${{ matrix.versions }}
          path: |
            results/
            .golden-work/_logs/
          if-no-files-found: ignore

  publish:
    name: publish results
    needs: golden
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: publish-ci-results
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: golden-*
          path: artifacts

      - name: Commit the results to the ci-results branch
        env:
          TESTED: ${{ github.head_ref || github.ref_name }}
          RUN_ID: ${{ github.run_id }}
          TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git clone --quiet --depth 1 --branch ci-results "$REPO_URL" out; then
            :
          else
            git init --quiet out
            git -C out checkout --quiet --orphan ci-results
            git -C out remote add origin "$REPO_URL"
          fi
          rm -rf "out/$TESTED"
          mkdir -p "out/$TESTED"
          find artifacts -path '*/results/*.json' -exec cp {} "out/$TESTED/" \;
          printf 'run %s\ncommit %s\n' "$RUN_ID" "$TESTED_SHA" > "out/$TESTED/RUN"
          git -C out add -A
          git -C out commit --quiet -m "Results of run $RUN_ID on $TESTED ($TESTED_SHA)"
          for attempt in 1 2 3; do
            if git -C out push --quiet origin ci-results; then exit 0; fi
            git -C out pull --quiet --rebase origin ci-results || true
          done
          exit 1

  regression:
    name: regression tests / ${{ matrix.toolchain }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolchain: linux-gcc
            os: ubuntu-24.04
          - toolchain: windows-mingw
            os: windows-2022
          - toolchain: macos-clang
            os: macos-15
    env:
      TAVNIT_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install MinGW-w64 GCC through MSYS2
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-gcc
      - name: Put MinGW g++ on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          Add-Content $env:GITHUB_PATH
          "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
      - name: Install the minimal library versions and pytest
        run: |
          python -m pip install uv
          python -m uv pip install --system --resolution lowest-direct --only-binary :all: -r requirements.txt
          python -m pip install pytest openpyxl
      - name: Run the regression tests
        run: python -m pytest -p no:cacheprovider tests/regression

  style:
    name: style report
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install the checkers
        run: python -m pip install -r requirements-dev.txt
      - name: Report findings (report-only until the plan makes them binding)
        run: python tests/check_style.py

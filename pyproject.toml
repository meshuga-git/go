# Tool settings only; the package is not built or installed with this file.
# The checks run through tests/check_style.py (plan task 0.6).

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = [".golden-work"]

[tool.ruff.lint]
select = ["E", "W", "F", "D", "B"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
allow-init-docstring = true
exclude = '\.golden-work'
